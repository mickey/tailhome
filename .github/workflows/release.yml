name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout fetches the tag without its message; goreleaser needs it for the release notes
      - run: git fetch --force --tags
      # Gemini CLI shows this version to users; it must match the tag being released.
      - run: test "$(jq -r .version gemini-extension.json)" = "${GITHUB_REF_NAME#v}" || { echo "Set gemini-extension.json version to ${GITHUB_REF_NAME#v}"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

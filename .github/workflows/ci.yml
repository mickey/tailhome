name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: python3 -m unittest discover skills/tailnet-preview/tests
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

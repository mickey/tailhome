services:
  tailhome:
    image: ghcr.io/mickey/tailhome:latest
    env_file: [{ path: .env, required: false }] # optional OAuth client, see .env.example
    environment:
      TZ: Etc/UTC # your time zone, for the "updated" time
    volumes:
      - tailhome-data:/data
    restart: unless-stopped

volumes:
  tailhome-data:
